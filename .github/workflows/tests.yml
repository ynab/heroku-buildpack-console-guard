name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The guard only ever runs on a Heroku stack image, so that is the only place
  # worth testing it: the suite runs inside every supported stack, and nowhere
  # else. heroku-22 is deprecated but supported through April 2027.
  tests-heroku-stack:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        stack: ["heroku/heroku:22", "heroku/heroku:24", "heroku/heroku:26"]
    container:
      image: ${{ matrix.stack }}
      # heroku/heroku:24 and :26 default to a non-root user, which cannot write
      # the runner's workspace, so checkout dies with EACCES before the suite
      # runs.
      options: --user root
    steps:
      - uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225 # v1.2.0
      # The guard's policy is Ruby. On a real dyno it runs the app's own
      # interpreter, installed by heroku/ruby; the stack images carry none, so
      # the suite stands the distribution's in for it. The version spread across
      # the matrix is the point -- it is what pins the guard to stdlib only.
      - name: Install Ruby
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ruby

      - name: versions
        run: |
          bash --version
          ruby --version
      # Policy. Runs anywhere Ruby does; it is in the stack matrix for the
      # version spread, not because it needs a stack.
      - name: Policy tests
        run: ruby test/run_ruby_tests.rb

      # Everything the shell does around the policy, which needs a real login
      # shell and procfs.
      - name: End-to-end tests
        run: ./test/run_tests.sh
